<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f4f1ea" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1a18" media="(prefers-color-scheme: dark)">
<title>Parlor</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-180.png">
<link rel="stylesheet" href="shared/theme.css">
<style>
.hub{flex:1;width:100%;overflow-y:auto;display:flex;flex-direction:column;align-items:center;gap:40px;padding:64px 16px 32px}
.masthead{text-align:center}
.wordmark{margin:0;font-size:min(18vw,96px);line-height:1;letter-spacing:-.01em}
.wordmark .dot{color:var(--warn)}
.lede{color:var(--muted);font-size:19px;margin:12px 0 0}
.games{list-style:none;margin:0;padding:0;width:min(900px,100%);display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,380px),1fr));gap:20px}

/* The card shell every game's card.html fills in. Each card is a small poster in its game's brand:
   the brand-<game> class swaps every token inside it; the game's card.css draws its art. */
.game{height:100%;display:flex;flex-direction:column;gap:18px;padding:24px;text-decoration:none;color:var(--text);font-family:var(--font);
  border-radius:var(--r-lg);box-shadow:var(--lift),inset 0 0 0 1px rgba(255,255,255,.07);
  background:radial-gradient(ellipse at 30% 20%, var(--bg-glow) 0%, var(--bg) 60%, var(--bg2) 100%)}
.game:active{transform:translateY(2px)}
.game h2{margin:0;font-size:30px}
.game p{margin:0;color:var(--muted);font-size:16px;line-height:1.45;flex:1}
.game .meta{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.game .play{align-self:flex-start;margin-top:4px;padding:10px 18px;border-radius:var(--r-sm);background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px;box-shadow:0 3px 0 var(--accent-edge)}
.game.plain{min-height:120px;justify-content:center;background:var(--surface);color:var(--text);font-size:22px;text-transform:capitalize}
.art{height:120px;border-radius:var(--r-md);display:flex;align-items:center;justify-content:center;padding:14px}

@media (max-width:480px){.hub{padding-top:40px}.game{padding:18px}}
</style>
</head>
<body>
<div class="app">
  <main class="hub">
    <header class="masthead">
      <h1 class="wordmark display">Parlor<span class="dot">.</span></h1>
      <p class="lede">Party games for one shared screen.</p>
    </header>
    <ul class="games" id="games"></ul>
    <p class="credit">Original names, word lists and artwork. Not affiliated with any game publisher.</p>
  </main>
</div>
<script src="shared/core.js"></script>
<script>
/* The games on offer, in order. Each folder packages its own hub card (card.html + card.css) and
   brand (brand.css), so adding or removing a game here is a one-word change.
   Also in the repo, not listed: slide-rule, eyeful, ringmaster, petri-dash, no-echo. */
var GAMES = ["tumbleword", "cover-story", "triad", "dice-cup"];

(function(){
  var list = Parlor.$("games");
  GAMES.forEach(function(id){
    ["brand.css", "card.css"].forEach(function(f){
      var l = document.createElement("link"); l.rel = "stylesheet"; l.href = id + "/" + f; document.head.appendChild(l);
    });
    var li = document.createElement("li"); list.appendChild(li); // placeholder keeps the order while cards load
    fetch(id + "/card.html").then(function(r){ if (!r.ok) throw 0; return r.text(); }).then(function(html){
      li.innerHTML = html;
      var a = li.querySelector("a.game"); if (a) a.href = id + "/";
    }).catch(function(){
      li.innerHTML = '<a class="game plain" href="' + id + '/">' + id.replace(/-/g, " ") + '</a>'; // still a working link
    });
  });
})();
Parlor.registerOffline("./");
</script>
</body>
</html>
