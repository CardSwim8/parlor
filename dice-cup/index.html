<!DOCTYPE html>
<html lang="en" class="brand-dice-cup">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1f1714">
<title>Dice Cup</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../icons/dice-cup-180.png">
<link rel="icon" href="../icons/dice-cup-180.png">
<link rel="stylesheet" href="../shared/theme.css">
<link rel="stylesheet" href="brand.css">
<style>
/* ---------- Page ---------- */
.bar .ghost.icon{width:52px;padding:0;display:flex;align-items:center;justify-content:center}
.bar .ghost[aria-pressed="false"]{color:var(--muted)}
#soundBtn[aria-pressed="true"] .off,#soundBtn[aria-pressed="false"] .on{display:none}
.home{white-space:nowrap}
.view{flex:1;width:100%;min-height:0}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Roll tab: the tray ---------- */
.rollview{max-width:1280px;display:flex;flex-direction:column;gap:12px;padding:0 16px 16px}
.tray{position:relative;flex:1;min-height:200px;border-radius:var(--r-lg);overflow-y:auto;padding:22px 18px 32px;
  box-shadow:inset 0 0 0 10px #2a1a14,inset 0 0 0 12px rgba(255,255,255,.06),inset 0 12px 30px rgba(0,0,0,.5),0 16px 36px rgba(0,0,0,.45)}
.dice{display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:var(--g,16px);min-height:100%}
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
.empty b{font-family:var(--font-display);font-size:26px}
.hint{position:absolute;left:0;right:0;bottom:9px;text-align:center;font-size:14px;color:var(--text);opacity:.55;pointer-events:none}
.rollrow{display:flex;gap:10px;align-items:stretch}
.rollrow .primary{flex:1;margin:0;font-family:var(--font-display);font-size:30px;letter-spacing:.06em}
.rollrow .primary:disabled{opacity:.45;box-shadow:0 6px 0 var(--accent-edge);transform:none;cursor:default}
.rollrow .ghost{min-width:110px}

/* ---------- A die ---------- */
.die{--s:96px;--body:var(--d-ivory);--pip:var(--d-ivory-ink);position:relative;width:var(--s);height:var(--s);flex:none;border:0;padding:0;background:none;border-radius:var(--r-sm);transition:transform .15s}
.die svg{display:block;width:100%;height:100%;overflow:visible;transform:rotate(var(--tilt,0deg));filter:drop-shadow(0 5px 4px rgba(0,0,0,.45))}
.die .b{fill:var(--body);stroke:rgba(0,0,0,.3);stroke-width:2;stroke-linejoin:round}
.die .s{fill:url(#shine);stroke:none}
.die .ln{fill:none;stroke:var(--pip);stroke-opacity:.28;stroke-width:2;stroke-linejoin:round}
.die .pip,.die .g{fill:var(--pip)}
.die .gs{fill:none;stroke:var(--pip);stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.die .red{fill:var(--suit-red)}
.die:not([data-c="ivory"]) .red{fill:var(--pip)}
.die .sw{stroke:rgba(0,0,0,.25);stroke-width:2}
.die text{fill:var(--pip);font-family:var(--font);font-weight:800;font-variant-numeric:lining-nums}
.die .ul{stroke:var(--pip);stroke-width:3;stroke-linecap:round}
.die .blank{fill:none;stroke:var(--pip);stroke-opacity:.2;stroke-width:2;stroke-dasharray:4 5}
.die[data-c="red"]{--body:var(--d-red);--pip:var(--d-red-ink)}
.die[data-c="blue"]{--body:var(--d-blue);--pip:var(--d-blue-ink)}
.die[data-c="green"]{--body:var(--d-green);--pip:var(--d-green-ink)}
.die[data-c="gold"]{--body:var(--d-gold);--pip:var(--d-gold-ink)}
.die[data-c="purple"]{--body:var(--d-purple);--pip:var(--d-purple-ink)}
.die[data-c="black"]{--body:var(--d-black);--pip:var(--d-black-ink)}
.tray .die:active{transform:scale(.94)}
.die.held{transform:translateY(-6px)}
.die.held svg{filter:drop-shadow(0 0 2px var(--accent)) drop-shadow(0 0 4px var(--accent)) drop-shadow(0 8px 6px rgba(0,0,0,.45))}
.die.held::after{content:"HELD";position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);padding:2px 7px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:800;letter-spacing:.08em}
.die.rolling svg{animation:tumble var(--dur,.6s) cubic-bezier(.25,.7,.35,1)}
.die.new svg{animation:drop .35s cubic-bezier(.3,1.4,.5,1)}
@keyframes tumble{
  0%{transform:translate(0,0) rotate(0deg) scale(1)}
  20%{transform:translate(-9%,-14%) rotate(120deg) scale(.86)}
  45%{transform:translate(8%,6%) rotate(250deg) scale(.92)}
  70%{transform:translate(-4%,-6%) rotate(320deg) scale(.97)}
  100%{transform:translate(0,0) rotate(calc(360deg + var(--tilt,0deg))) scale(1)}
}
@keyframes drop{from{transform:translateY(-30%) scale(.4) rotate(-60deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.die.rolling svg,.die.new svg{animation:none}}

/* ---------- Dice tab: choosing what's in the cup ---------- */
.diceview{overflow-y:auto;-webkit-overflow-scrolling:touch}
.shelf{width:min(1000px,100%);margin:0 auto;display:flex;flex-direction:column;gap:14px;padding:0 16px 40px}
.cupbar{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 14px;border-radius:var(--r-lg);background:var(--surface);box-shadow:var(--lift)}
.cupbar .what{flex:1 1 200px;display:flex;flex-direction:column;gap:2px}
.cupbar .label{color:var(--text);opacity:.7;font-size:13px}
.cupbar #cupSummary{font-size:19px;font-weight:700}
.cupbar .primary{margin:0;padding:10px 20px;min-height:48px;font-size:19px;font-family:var(--font-display);box-shadow:0 4px 0 var(--accent-edge)}
.cupbar .ghost{border-color:rgba(255,255,255,.3)}
.shelf h2{margin:14px 0 0;font-size:15px}
.shelf .sub{margin:-8px 0 0;color:var(--muted);font-size:15px}
.colours{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.colours button{width:40px;height:40px;border-radius:50%;border:2px solid rgba(255,255,255,.3);background:var(--sw);box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.colours button[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:3px}
.grid{display:grid;gap:10px}
.grid.small{grid-template-columns:repeat(auto-fill,minmax(124px,1fr))}
.grid.wide{grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr))}
.card{min-width:0;border:1px solid transparent;border-radius:var(--r-md);background:var(--well);padding:12px;color:var(--text);text-align:left}
.card.has{border-color:var(--accent)}
.card .pick{border:0;background:none;padding:0;border-radius:var(--r-sm)}
.card .pick:active{transform:scale(.94)}
.card .die{display:block;pointer-events:none}
.card .die svg{filter:drop-shadow(0 3px 3px rgba(0,0,0,.4))}
.card .info b{font-size:18px}
.card .info p{margin:4px 0 0;font-size:15px;line-height:1.4;color:var(--muted)}
.card .del{margin-top:8px;border:0;background:none;padding:4px 0;color:var(--muted);font-size:14px;text-decoration:underline}
.count{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:4px;width:100%;max-width:170px;background:var(--well);border-radius:var(--r-sm);padding:3px}
.count button{min-width:0;height:40px;border:0;border-radius:8px;background:var(--soft);font-size:24px;line-height:1}
.count button:disabled{opacity:.3;cursor:default}
.count output{min-width:34px;text-align:center;font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.card.small{display:flex;flex-direction:column;align-items:center;gap:6px}
.card.small .die{--s:58px}
.card.wide{display:grid;grid-template-columns:72px 1fr;grid-template-areas:"pick info" "pick count";gap:10px 14px;align-items:start}
.card.wide .pick{grid-area:pick;align-self:center}
.card.wide .die{--s:66px}
.card.wide .info{grid-area:info}
.card.wide .count{grid-area:count}
.card.make{display:flex;align-items:center;gap:14px;border:1.5px dashed var(--line);background:transparent;font:inherit}
.card.make .plus{width:66px;flex:none;text-align:center;font-size:40px;line-height:1;color:var(--accent)}
.card.make b{font-size:18px}
.card.make p{margin:4px 0 0;font-size:15px;color:var(--muted)}

/* ---------- Make-a-die dialog and toast ---------- */
.scrim{position:fixed;inset:0;z-index:19;background:rgba(0,0,0,.5)}
.pop.modal{left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,calc(100vw - 24px));max-height:calc(100% - 24px);overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.pop.modal .head{margin:0}
.pop.modal .head b{font-size:22px}
.pop .seg{background:rgba(0,0,0,.07)}
.pop .seg button{flex:1;font-size:16px;padding:10px}
.pop .seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.pop .row > span{color:var(--ink-soft);font-size:18px}
.pop .stepper{background:rgba(0,0,0,.07)}
.pop .stepper button{background:rgba(0,0,0,.07);color:var(--ink)}
.pop .stepper input{width:84px;border:0;background:transparent;text-align:center;font:inherit;font-size:24px;font-weight:700;color:var(--ink);-moz-appearance:textfield}
.pop .stepper input::-webkit-inner-spin-button,.pop .stepper input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.pop label{display:flex;flex-direction:column;gap:6px;font-size:15px;color:var(--ink-soft)}
.pop .field{color:var(--ink);background:#fff;border-color:rgba(0,0,0,.2)}
.pop .note{color:var(--ink-faint);text-align:left;margin:0}
.pop .primary{margin:0;font-size:20px;padding:14px;min-height:54px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid rgba(0,0,0,.18);background:transparent;border-radius:999px;padding:6px 12px;font-size:15px;color:var(--ink);min-height:36px}
.toast{position:fixed;z-index:30;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:center;gap:14px;max-width:calc(100vw - 24px);padding:10px 10px 10px 18px;border-radius:var(--r-md);background:var(--paper);color:var(--ink);box-shadow:0 12px 30px rgba(0,0,0,.5);font-size:16px}
.toast button{border:0;background:var(--ink);color:var(--paper);border-radius:var(--r-sm);padding:8px 14px;font-weight:700;min-height:40px}


@media (max-width:560px){
  .rollview{padding:0 10px 10px;gap:10px}
  .tray{padding:18px 12px 30px}
  .rollrow .ghost{min-width:0}
  .shelf{padding:0 10px 32px}
  .grid.small{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .card.small{padding:8px}
  .card.small .die{--s:48px}
  .card.small .count{padding:2px;gap:2px}
  .card.small .count button{height:36px;font-size:20px}
  .card.small .count output{min-width:22px;font-size:17px}
  .card.wide{grid-template-columns:56px 1fr;gap:8px 12px}
  .card.wide .die{--s:54px}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".42"/>
      <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".16"/>
    </linearGradient>
  </defs>
</svg>

<div class="app">
  <header class="bar">
    <div class="left"><a class="home" href="../">‹ Games</a></div>
    <div class="center">
      <nav class="tabs" id="tabs" role="tablist">
        <button role="tab" data-tab="roll" aria-selected="true">Roll</button>
        <button role="tab" data-tab="dice" aria-selected="false">Dice</button>
      </nav>
    </div>
    <div class="right"><button class="ghost icon" id="soundBtn" aria-pressed="true" aria-label="Sound" title="Sound"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M3 9h4l6-5v16l-6-5H3z" fill="currentColor"/><path class="on" d="M16 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path class="off" d="M16 9l6 6M22 9l-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button></div>
  </header>

  <main class="view rollview" id="rollView">
    <div class="tray surface" id="tray" role="group" aria-label="Dice in the cup"></div>
    <div class="rollrow">
      <button class="primary" id="rollBtn">Roll</button>
      <button class="ghost" id="releaseBtn" hidden>Release</button>
    </div>
    <p class="sr" id="said" aria-live="polite"></p>
  </main>

  <main class="view diceview" id="diceView" hidden>
    <div class="shelf">
      <div class="cupbar">
        <div class="what"><span class="label">In the cup</span><span id="cupSummary"></span></div>
        <button class="ghost" id="clearBtn">Empty</button>
        <button class="primary" data-goto="roll">Roll these</button>
      </div>
      <h2 class="label">Colour for new dice</h2>
      <div class="colours" id="colours" role="group" aria-label="Colour for new dice"></div>
      <h2 class="label">Standard</h2>
      <p class="sub">Numbered from 1 up to the number in the name: a d20 rolls 1 to 20.</p>
      <div class="grid small" id="standard"></div>
      <h2 class="label">Specialty</h2>
      <div class="grid wide" id="specialty"></div>
      <h2 class="label">Your dice</h2>
      <div class="grid wide" id="custom"></div>
    </div>
  </main>
</div>

<div class="scrim" id="scrim" hidden></div>

<div class="pop modal" id="makePop" role="dialog" aria-modal="true" aria-labelledby="makeTitle" hidden>
  <div class="head"><b class="display" id="makeTitle">Make a die</b><button class="x" data-close aria-label="Close">×</button></div>
  <div class="seg" id="makeMode">
    <button data-m="sides" aria-pressed="true">Numbered</button>
    <button data-m="faces" aria-pressed="false">Your own faces</button>
  </div>
  <div id="sidesBox" class="controls" style="gap:12px">
    <div class="row">
      <span>Sides</span>
      <div class="stepper"><button id="sMinus" aria-label="Fewer sides">−</button><input id="sidesIn" type="number" inputmode="numeric" min="2" max="1000" value="7" aria-label="Number of sides"><button id="sPlus" aria-label="More sides">+</button></div>
    </div>
    <div class="chips" id="sideChips"></div>
    <p class="note">Numbered 1 to the number of sides.</p>
  </div>
  <div id="facesBox" hidden>
    <label>Faces, separated by commas
      <input class="field" id="facesIn" placeholder="Hit, Hit, Miss, Crit" autocomplete="off" autocapitalize="sentences">
    </label>
    <p class="note" id="facesNote">Repeat a face to make it come up more often.</p>
  </div>
  <label>Name on the shelf (optional)
    <input class="field" id="nameIn" maxlength="14" autocomplete="off">
  </label>
  <button class="primary" id="makeBtn">Add to shelf</button>
</div>

<div class="toast" id="toast" role="status" hidden><span id="toastText"></span><button id="toastUndo">Undo</button></div>

<script src="../shared/core.js"></script>
<script src="dice-cup.js"></script>
</body>
</html>
