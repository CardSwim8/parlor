<!DOCTYPE html>
<html lang="en" class="brand-dice-cup">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#1f1714">
<title>Dice Cup</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="apple-touch-icon" href="../icons/dice-cup-180.png">
<link rel="icon" href="../icons/dice-cup-180.png">
<link rel="stylesheet" href="../shared/theme.css">
<link rel="stylesheet" href="brand.css">
<style>
/* ---------- Page ---------- */
.bar .center h1{margin:0;font-size:26px}
.bar .ghost[aria-pressed="false"]{color:var(--muted)}
.table{flex:1;width:100%;max-width:1280px;min-height:0;display:flex;flex-direction:column;gap:12px;padding:0 16px 16px}
.play{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px}

/* ---------- Tray ---------- */
.tray{position:relative;flex:1;min-height:200px;border-radius:var(--r-lg);overflow-y:auto;padding:22px 18px 30px;
  box-shadow:inset 0 0 0 10px #2a1a14,inset 0 0 0 12px rgba(255,255,255,.06),inset 0 12px 30px rgba(0,0,0,.5),0 16px 36px rgba(0,0,0,.45)}
.dice{display:flex;flex-wrap:wrap;justify-content:center;align-content:center;gap:var(--g,16px);min-height:100%}
.empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:24px;text-align:center;color:var(--text);opacity:.8}
.empty b{font-family:var(--font-display);font-size:24px}
.empty span{font-size:16px;color:var(--muted)}
.hint{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:13px;color:var(--text);opacity:.55;pointer-events:none}

/* ---------- A die ---------- */
.die{--s:96px;--body:var(--d-ivory);--pip:var(--d-ivory-ink);position:relative;width:var(--s);height:var(--s);flex:none;border:0;padding:0;background:none;border-radius:var(--r-sm);transition:transform .15s}
.die svg{display:block;width:100%;height:100%;overflow:visible;transform:rotate(var(--tilt,0deg));filter:drop-shadow(0 5px 4px rgba(0,0,0,.45))}
.die .b{fill:var(--body);stroke:rgba(0,0,0,.3);stroke-width:2;stroke-linejoin:round}
.die .s{fill:url(#shine);stroke:none}
.die .ln{fill:none;stroke:var(--pip);stroke-opacity:.28;stroke-width:2;stroke-linejoin:round}
.die .pip,.die .g{fill:var(--pip)}
.die .gs{fill:none;stroke:var(--pip);stroke-width:7;stroke-linecap:round;stroke-linejoin:round}
.die .red{fill:var(--suit-red)}
.die:not([data-c="ivory"]) .red{fill:var(--pip)}
.die .sw{stroke:rgba(0,0,0,.25);stroke-width:2}
.die text{fill:var(--pip);font-family:var(--font);font-weight:800;font-variant-numeric:lining-nums}
.die .ul{stroke:var(--pip);stroke-width:3;stroke-linecap:round}
.die .blank{fill:none;stroke:var(--pip);stroke-opacity:.2;stroke-width:2;stroke-dasharray:4 5}
.die[data-c="red"]{--body:var(--d-red);--pip:var(--d-red-ink)}
.die[data-c="blue"]{--body:var(--d-blue);--pip:var(--d-blue-ink)}
.die[data-c="green"]{--body:var(--d-green);--pip:var(--d-green-ink)}
.die[data-c="gold"]{--body:var(--d-gold);--pip:var(--d-gold-ink)}
.die[data-c="purple"]{--body:var(--d-purple);--pip:var(--d-purple-ink)}
.die[data-c="black"]{--body:var(--d-black);--pip:var(--d-black-ink)}
.tray .die:active{transform:scale(.94)}
.die.held{transform:translateY(-6px)}
.die.held svg{filter:drop-shadow(0 0 2px var(--accent)) drop-shadow(0 0 4px var(--accent)) drop-shadow(0 8px 6px rgba(0,0,0,.45))}
.die.held::after{content:"HELD";position:absolute;left:50%;bottom:-8px;transform:translateX(-50%);padding:2px 7px;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-size:11px;font-weight:800;letter-spacing:.08em}
.die.rolling svg{animation:tumble var(--dur,.6s) cubic-bezier(.25,.7,.35,1)}
.die.new svg{animation:drop .35s cubic-bezier(.3,1.4,.5,1)}
@keyframes tumble{
  0%{transform:translate(0,0) rotate(0deg) scale(1)}
  20%{transform:translate(-9%,-14%) rotate(120deg) scale(.86)}
  45%{transform:translate(8%,6%) rotate(250deg) scale(.92)}
  70%{transform:translate(-4%,-6%) rotate(320deg) scale(.97)}
  100%{transform:translate(0,0) rotate(calc(360deg + var(--tilt,0deg))) scale(1)}
}
@keyframes drop{from{transform:translateY(-30%) scale(.4) rotate(-60deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.die.rolling svg,.die.new svg{animation:none}}

/* ---------- Results ---------- */
.results{display:flex;align-items:center;gap:18px;min-height:76px;padding:10px 16px;border-radius:var(--r-lg);background:var(--well)}
.results.rolling{opacity:.35}
.total{flex:none;text-align:center;min-width:84px}
.total b{display:block;font-family:var(--font-display);font-size:52px;line-height:1;font-variant-numeric:tabular-nums;color:var(--accent)}
.total span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.lines{flex:1;min-width:0;max-height:118px;overflow-y:auto;margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.lines li{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:16px}
.lines .what{font-weight:700;min-width:64px;white-space:nowrap}
.lines .what small{font-weight:400;color:var(--muted)}
.lines .faces{display:flex;flex-wrap:wrap;gap:4px}
.lines .faces i{font-style:normal;min-width:28px;padding:2px 7px;border-radius:7px;background:var(--soft);text-align:center;font-variant-numeric:tabular-nums}
.lines .faces i.held{box-shadow:inset 0 0 0 1.5px var(--accent)}
.lines .faces i .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.lines .sum{color:var(--muted)}
.lines .sum b{color:var(--text)}
.waiting{flex:1;color:var(--muted);font-size:17px}
.mod{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px}
.mod .label{font-size:12px}
.mod .stepper{padding:3px;gap:2px}
.mod .stepper button{width:40px;height:40px;font-size:22px}
.mod .stepper output{min-width:48px;font-size:20px}

/* ---------- Roll row ---------- */
.rollrow{display:flex;gap:10px;align-items:stretch}
.rollrow .primary{flex:1;margin:0;font-family:var(--font-display);font-size:28px;letter-spacing:.06em}
.rollrow .primary:disabled{opacity:.45;box-shadow:0 6px 0 var(--accent-edge);transform:none;cursor:default}
.rollrow .ghost{min-width:84px}

/* ---------- Shelf ---------- */
.shelf{flex:none;max-height:42vh;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:14px;padding:14px;border-radius:var(--r-lg);background:var(--well)}
@supports (height:100dvh){.shelf{max-height:42dvh}}
.shelf h2{margin:0 0 -4px;font-size:15px}
.strip{display:flex;flex-direction:column;gap:14px}
.colours{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.colours button{width:36px;height:36px;border-radius:50%;border:2px solid rgba(255,255,255,.3);background:var(--sw);box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.colours button[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:2px}
.racks{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px}
.item{position:relative}
.item .add{width:100%;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px 6px;border:1px solid transparent;border-radius:var(--r-md);background:var(--soft);min-height:88px}
.item .add:active{background:var(--line)}
.item .add.has{border-color:var(--accent)}
.item .die{--s:46px;pointer-events:none}
.item .die svg{filter:drop-shadow(0 3px 2px rgba(0,0,0,.4))}
.item .lab{font-size:13px;line-height:1.15;text-align:center;color:var(--text)}
.item .count{position:absolute;top:-6px;right:-4px;min-width:24px;height:24px;padding:0 6px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-size:14px;line-height:24px;text-align:center;pointer-events:none}
.item .minus{position:absolute;top:-6px;left:-4px;width:30px;height:30px;border-radius:50%;border:0;background:var(--paper);color:var(--ink);font-size:20px;line-height:1;box-shadow:0 2px 4px rgba(0,0,0,.4)}
.item .add.make{border:1.5px dashed var(--line);background:transparent;justify-content:center}
.item .add.make .plus{font-size:30px;line-height:1;color:var(--accent)}

/* ---------- Dialogs and toast ---------- */
.scrim{position:fixed;inset:0;z-index:19;background:rgba(0,0,0,.5)}
.pop.modal{left:50%;top:50%;transform:translate(-50%,-50%);width:min(420px,calc(100vw - 24px));max-height:calc(100% - 24px);overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.pop.modal .head{margin:0}
.pop.modal .head b{font-size:22px}
.pop .seg{background:rgba(0,0,0,.07)}
.pop .seg button{flex:1;font-size:16px;padding:10px}
.pop .seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.pop .row > span{color:var(--ink-soft);font-size:18px}
.pop .stepper{background:rgba(0,0,0,.07)}
.pop .stepper button{background:rgba(0,0,0,.07);color:var(--ink)}
.pop .stepper input{width:84px;border:0;background:transparent;text-align:center;font:inherit;font-size:24px;font-weight:700;color:var(--ink);-moz-appearance:textfield}
.pop .stepper input::-webkit-inner-spin-button,.pop .stepper input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}
.pop label{display:flex;flex-direction:column;gap:6px;font-size:15px;color:var(--ink-soft)}
.pop .field{color:var(--ink);background:#fff;border-color:rgba(0,0,0,.2)}
.pop .note{color:var(--ink-faint);text-align:left;margin:0}
.pop .primary{margin:0;font-size:20px;padding:14px;min-height:54px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid rgba(0,0,0,.18);background:transparent;border-radius:999px;padding:6px 12px;font-size:15px;color:var(--ink);min-height:36px}
.mine{display:flex;flex-direction:column;gap:6px;border-top:1px solid rgba(0,0,0,.12);padding-top:12px}
.mine .label{color:var(--ink-faint)}
.mine div{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:16px}
.mine div span small{color:var(--ink-faint)}
.mine button{border:1px solid rgba(0,0,0,.18);background:transparent;border-radius:var(--r-sm);padding:6px 12px;color:var(--ink);font-size:14px}
.hist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.hist button{width:100%;display:grid;grid-template-columns:1fr auto;align-items:center;gap:2px 12px;text-align:left;border:1px solid rgba(0,0,0,.12);background:#fff;border-radius:var(--r-sm);padding:8px 12px;color:var(--ink)}
.hist button:active{background:var(--accent-soft)}
.hist .what{font-weight:700;font-size:16px}
.hist .when{grid-row:span 2;font-family:var(--font-display);font-size:26px;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}
.hist .faces{font-size:14px;color:var(--ink-soft);overflow-wrap:anywhere}
.hist .time{font-size:12px;color:var(--ink-faint)}
.toast{position:fixed;z-index:30;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:center;gap:14px;max-width:calc(100vw - 24px);padding:10px 10px 10px 18px;border-radius:var(--r-md);background:var(--paper);color:var(--ink);box-shadow:0 12px 30px rgba(0,0,0,.5);font-size:16px}
.toast button{border:0;background:var(--ink);color:var(--paper);border-radius:var(--r-sm);padding:8px 14px;font-weight:700;min-height:40px}

/* ---------- Wide screens: shelf beside the tray ---------- */
@media (min-width:900px) and (min-aspect-ratio:1/1){
  .table{flex-direction:row}
  .shelf{width:360px;max-height:none}
}
@media (max-width:560px){
  .bar .center{display:none}
  .table{padding:0 10px 10px;gap:10px}
  .tray{padding:18px 12px 28px}
  .results{gap:10px;padding:8px 10px;min-height:64px}
  .total{min-width:56px}
  .total b{font-size:38px}
  .lines{max-height:84px;gap:4px}
  .lines li{gap:6px;font-size:15px}
  .lines .what{min-width:0}
  .mod .label{display:none}
  .mod .stepper button{width:34px;height:36px;font-size:20px}
  .mod .stepper output{min-width:36px;font-size:17px}
  .rollrow .ghost{min-width:0}
  .rollrow .primary{font-size:24px;min-height:58px;padding:14px}
  /* the shelf becomes one strip you scroll sideways, so the tray keeps the height */
  .shelf{max-height:none;gap:10px;padding:10px}
  .shelf > h2{display:none}
  .colours{gap:10px}
  .colours button{width:32px;height:32px}
  .strip{flex-direction:row;overflow-x:auto;gap:8px;padding:8px 4px 2px;margin:-8px -4px 0}
  .strip h2{display:none}
  .strip .racks{display:contents}
  .strip .item{flex:none;width:76px}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".42"/>
      <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".16"/>
    </linearGradient>
  </defs>
</svg>

<div class="app">
  <header class="bar">
    <div class="left"><a class="home" href="../">‹ Games</a></div>
    <div class="center"><h1 class="display">Dice Cup</h1></div>
    <div class="right">
      <button class="ghost" id="soundBtn" aria-pressed="true">Sound</button>
      <button class="ghost" id="histBtn">History</button>
    </div>
  </header>

  <main class="table">
    <section class="play">
      <div class="tray surface" id="tray" role="group" aria-label="Dice in the cup"></div>
      <div class="results" id="results" aria-live="polite"></div>
      <div class="rollrow">
        <button class="ghost" id="clearBtn">Clear</button>
        <button class="primary" id="rollBtn">Roll</button>
        <button class="ghost" id="releaseBtn" hidden>Release</button>
      </div>
    </section>
    <aside class="shelf" id="shelf" aria-label="Dice to add"></aside>
  </main>
</div>

<div class="scrim" id="scrim" hidden></div>

<div class="pop modal" id="makePop" role="dialog" aria-modal="true" aria-labelledby="makeTitle" hidden>
  <div class="head"><b class="display" id="makeTitle">Make a die</b><button class="x" data-close aria-label="Close">×</button></div>
  <div class="seg" id="makeMode">
    <button data-m="sides" aria-pressed="true">Numbered</button>
    <button data-m="faces" aria-pressed="false">Your own faces</button>
  </div>
  <div id="sidesBox" class="controls" style="gap:12px">
    <div class="row">
      <span>Sides</span>
      <div class="stepper"><button id="sMinus" aria-label="Fewer sides">−</button><input id="sidesIn" type="number" inputmode="numeric" min="2" max="1000" value="7" aria-label="Number of sides"><button id="sPlus" aria-label="More sides">+</button></div>
    </div>
    <div class="chips" id="sideChips"></div>
    <p class="note">Numbered 1 to the number of sides.</p>
  </div>
  <div id="facesBox" hidden>
    <label>Faces, separated by commas
      <input class="field" id="facesIn" placeholder="Hit, Hit, Miss, Crit" autocomplete="off" autocapitalize="sentences">
    </label>
    <p class="note" id="facesNote">Repeat a face to make it come up more often. If every face is a number, they're added to the total.</p>
  </div>
  <label>Name on the shelf (optional)
    <input class="field" id="nameIn" maxlength="14" autocomplete="off">
  </label>
  <button class="primary" id="makeBtn">Add to shelf</button>
  <div class="mine" id="mine" hidden></div>
</div>

<div class="pop modal" id="histPop" role="dialog" aria-modal="true" aria-labelledby="histTitle" hidden>
  <div class="head"><b class="display" id="histTitle">History</b><button class="x" data-close aria-label="Close">×</button></div>
  <p class="note" id="histNote">Tap a roll to put those dice back in the cup.</p>
  <ul class="hist" id="histList"></ul>
  <button class="ghost" id="histClear" style="color:var(--ink);border-color:rgba(0,0,0,.2)">Clear history</button>
</div>

<div class="toast" id="toast" role="status" hidden><span id="toastText"></span><button id="toastUndo">Undo</button></div>

<script src="../shared/core.js"></script>
<script src="dice-cup.js"></script>
</body>
</html>
